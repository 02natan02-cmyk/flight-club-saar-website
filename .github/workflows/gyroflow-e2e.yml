name: Gyroflow Ende-zu-Ende-Test
on:
  push:
    branches: [gyroflow-test]
    paths: ['.github/workflows/gyroflow-e2e.yml']
permissions:
  contents: write
env:
  HOOK: https://hook.eu1.make.com/ue6rysv2dwkk9lozrsnjzyy55edkpz9i
  JOB: a25d61c6863ca096
jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Status wie die Website abfragen und fertigen Clip prüfen
        run: |
          set -euo pipefail
          sudo apt-get install -y -qq ffmpeg >/dev/null
          python3 - <<'PY'
          import os, json, urllib.request, urllib.parse
          r = urllib.request.urlopen(os.environ['HOOK'] + '?' + urllib.parse.urlencode({'a': 'status', 'id': os.environ['JOB']}), timeout=60).read().decode()
          j = json.loads(r)
          if j.get('url'): print('::add-mask::' + j['url'])
          print('Status:', j.get('st'), '| Datei:', j.get('name'), '|', j.get('size'), 'Bytes | Link vorhanden:', bool(j.get('url')))
          assert j.get('st') == 'fertig' and j.get('url'), 'nicht fertig'
          urllib.request.urlretrieve(j['url'], 'fertig.mp4')
          print('Heruntergeladen:', os.path.getsize('fertig.mp4'), 'Bytes')
          PY
          mkdir -p ergebnis
          ffprobe -v error -show_entries format=duration,bit_rate:stream=codec_name,width,height,r_frame_rate -of compact fertig.mp4 | tee ergebnis/info.txt
          ffmpeg -v error -i fertig.mp4 -vf "fps=1/4,scale=480:-2,tile=3x3" -frames:v 1 ergebnis/kontaktbogen.jpg
          ffmpeg -v error -ss 8 -i fertig.mp4 -t 6 -vf scale=640:-2 -c:v libx264 -crf 28 -an ergebnis/ausschnitt.mp4
          ls -la ergebnis
      - name: Ergebnis-Vorschau auf eigenen Zweig legen
        run: |
          git config --global user.name "gyroflow-test"; git config --global user.email "actions@users.noreply.github.com"
          git init -q vorschau && cd vorschau && git checkout -q -b "gyroflow-ergebnis-${GITHUB_RUN_ID}"
          cp ../ergebnis/* . && git add . && git commit -q -m "Gyroflow-Ergebnis Vorschau ${GITHUB_RUN_ID}"
          git push -q "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" HEAD
# Lauf 3: nur Status und Download prüfen (Station lief, Auftrag fertig)
