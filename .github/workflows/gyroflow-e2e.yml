name: Gyroflow Ende-zu-Ende-Test
on:
  push:
    branches: [gyroflow-test]
    paths: ['.github/workflows/gyroflow-e2e.yml']
permissions:
  contents: read
env:
  HOOK: https://hook.eu1.make.com/ue6rysv2dwkk9lozrsnjzyy55edkpz9i
jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Live-API prüfen (Kartenlink, Mitgliedscode)
        run: |
          set -euo pipefail
          echo "Kartenlink:"; curl -sS -G "$HOOK" --data-urlencode a=maplink --data-urlencode "u=https://maps.app.goo.gl/PB8N7vSjhJRb4pnZ9?g_st=ac" | cut -c1-140; echo
          echo "Code falsch:"; curl -sS -X POST "$HOOK" --data-urlencode a=check --data-urlencode c=FCS-XXXX-XXXX; echo
          echo "Code Test:"; curl -sS -X POST "$HOOK" --data-urlencode a=check --data-urlencode c=fcs-tqvl-unwm; echo
          curl -sS -G "$HOOK" --data-urlencode a=maplink --data-urlencode "u=https://maps.app.goo.gl/PB8N7vSjhJRb4pnZ9?g_st=ac" | grep -q '49.3449' && echo "KARTENLINK OK"
# Lauf 5: Live-API Kartenlink und Mitgliedscode
